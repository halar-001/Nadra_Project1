spring:
  application:
    name: ai-database-assistant
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

security:
  jwt:
    secret: ${JWT_SECRET}

gemini:
  api:
    key: ${GEMINI_API_KEY}

groq:
  api:
    key: ${GROQ_API_KEY}
