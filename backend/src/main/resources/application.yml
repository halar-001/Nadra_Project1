spring:
  application:
    name: ai-database-assistant
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:sa}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dummy@gmail.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET:thisisaverysecuresecretkeyforjwtauthenticationthatisverylong12345}
    expiration: 86400000 # 24 hours

gemini:
  api:
    key: ${GEMINI_API_KEY:dummy}

groq:
  api:
    key: ${GROQ_API_KEY:dummy}
